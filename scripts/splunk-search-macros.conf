# Splunk Search Macros for SOC Investigations
# Add to $SPLUNK_HOME/etc/apps/search/local/macros.conf
# Restart Splunk after adding

# ============================================================
# BASE MACROS
# ============================================================

[winevents]
definition = index=winevents sourcetype=xmlwineventlog
iseval = 0

[sysmon]
definition = index=winevents sourcetype=xmlwineventlog (EventCode=1 OR EventCode=3 OR EventCode=7 OR EventCode=8 OR EventCode=10 OR EventCode=11 OR EventCode=12 OR EventCode=13 OR EventCode=14 OR EventCode=15 OR EventCode=22 OR EventCode=23 OR EventCode=25)
iseval = 0

[ps_process]
definition = `winevents` EventCode=4688
iseval = 0

[ps_network]
definition = `winevents` EventCode=3
iseval = 0

[ps_registry]
definition = `winevents` EventCode IN (12,13,14)
iseval = 0

[ps_task]
definition = `winevents` EventCode=4698
iseval = 0

[ps_logon]
definition = `winevents` EventCode=4624
iseval = 0

[ps_logon_fail]
definition = `winevents` EventCode=4625
iseval = 0

# ============================================================
# POWERSHELL MACROS
# ============================================================

[ps_powershell]
definition = `ps_process` New_Process_Name="*powershell.exe"
iseval = 0

[ps_ps_encoded]
definition = `ps_powershell` (match(Command_Line, "(?i)(-enc|-encodedcommand|frombase64string|iex|invoke-expression)"))
iseval = 0

[ps_ps_suspicious]
definition = `ps_powershell` (match(Command_Line, "(?i)(iex|invoke-expression|downloadstring|downloadfile|webclient|net.webclient|invoke-webrequest|irm|iwr|start-process|saps|invoke-command|icm|enter-pssession|epsn|new-object.*comobject|wscript\.shell|shell\.application)"))
iseval = 0

[ps_ps_network]
definition = `ps_ps_encoded`
| join type=left ProcessId, _time
    [ `ps_network`
    | stats values(DestinationIp) as dest_ips, values(DestinationPort) as dest_ports by ProcessId, _time ]
| where isnotnull(dest_ips)
iseval = 0

# ============================================================
# CMD MACROS
# ============================================================

[ps_cmd]
definition = `ps_process` New_Process_Name="*cmd.exe"
iseval = 0

[ps_cmd_suspicious]
definition = `ps_cmd` match(Command_Line, "(/c|/k|/v:on|&&|\|\||>|<|\^|cmd\.exe\s+/c)")
iseval = 0

# ============================================================
# LOLBAS MACROS
# ============================================================

[ps_lolbas]
definition = `ps_process` (match(New_Process_Name, "(?i)(certutil|rundll32|mshta|regsvr32|wmic|reg)\.exe"))
iseval = 0

[ps_lolbas_suspicious]
definition = `ps_lolbas` NOT (match(New_Process_Name, "C:\\\\Windows\\\\System32\\\\") OR match(New_Process_Name, "C:\\\\Windows\\\\SysWOW64\\\\"))
iseval = 0

[ps_certutil_decode]
definition = `ps_process` New_Process_Name="*certutil.exe" match(Command_Line, "-decode")
iseval = 0

[ps_rundll32_comsvcs]
definition = `ps_process` New_Process_Name="*rundll32.exe" match(Command_Line, "comsvcs\.dll.*MiniDump")
iseval = 0

# ============================================================
# PERSISTENCE MACROS
# ============================================================

[ps_scheduled_task]
definition = `ps_task` match(Task_Content, "(powershell|cmd|wscript|cscript|mshta).*(-enc|-encodedcommand|iex|downloadstring)")
iseval = 0

[ps_registry_run]
definition = `ps_registry` match(TargetObject, ".*\\\\(Run|RunOnce)$") match(Details, "(powershell|cmd|wscript|cscript|mshta|rundll32).*(-enc|-encodedcommand|iex|downloadstring)")
iseval = 0

# ============================================================
# CREDENTIAL ACCESS MACROS
# ============================================================

[ps_lsass_access]
definition = `winevents` EventCode=10 TargetImage="*lsass.exe" GrantedAccess IN ("0x1010","0x1fffff","0x001f0fff","0x000f0fff")
iseval = 0

[ps_lsass_tools]
definition = `ps_process` match(New_Process_Name, "(?i)(mimikatz|procdump|sqldumper|werfault|comsvcs|rundll32)\.exe")
iseval = 0

# ============================================================
# LATERAL MOVEMENT MACROS
# ============================================================

[ps_smb_lateral]
definition = `ps_process` match(New_Process_Name, "(?i)(psexec|wmiexec|smbexec|atexec|sc)\.exe") OR (EventCode=4697 Service_Name="PSEXESVC")
iseval = 0

[ps_admin_logon]
definition = `ps_logon` Logon_Type=3 TargetUserName="administrator" NOT Workstation_Name IN ("admin-ws","mgmt-ws","bastion")
iseval = 0

[ps_wmi_lateral]
definition = `ps_process` ParentProcess_Name="*wmiprvse.exe" New_Process_Name IN ("*cmd.exe","*powershell.exe")
iseval = 0

[ps_winrm_lateral]
definition = `ps_process` ParentProcess_Name="*wsmprovhost.exe" New_Process_Name IN ("*cmd.exe","*powershell.exe")
iseval = 0

# ============================================================
# DEFENSE EVASION MACROS
# ============================================================

[ps_file_deletion]
definition = `ps_process` (match(New_Process_Name, "(?i)(cipher|sdelete|shred)\.exe") OR (match(New_Process_Name, "powershell\.exe") AND match(Command_Line, "(Remove-Item|del|erase).*(-Force|-Recurse|-f|-s|-q|-r)")))
iseval = 0

# ============================================================
# NETWORK MACROS
# ============================================================

[ps_c2_beacon]
definition = `ps_network`
| stats count avg(duration) as avg_dur stdev(duration) as stdev_dur by DestinationIp, DestinationPort, _time span=1m
| where stdev_dur < 10 AND count > 5
iseval = 0

[ps_exfil_large_post]
definition = `ps_network`
| eval size=request_bytes + response_bytes
| where size > 100000
| stats sum(size) as total_bytes by DestinationIp, _time span=5m
iseval = 0

# ============================================================
# COMPOSITE INVESTIGATION MACROS
# ============================================================

[inv_bruteforce_chain]
definition = `ps_logon_fail`
| stats count as failures by TargetUserName, IpAddress, _time span=1m
| where failures > 10
| join type=left TargetUserName, IpAddress
    [ `ps_logon` Logon_Type=3
    | stats count as successes by TargetUserName, IpAddress, _time span=1m ]
| where isnotnull(successes)
iseval = 0

[inv_ps_encoded_network]
definition = `ps_ps_encoded`
| join type=left ProcessId, _time
    [ `ps_network`
    | stats values(DestinationIp) as dest_ips, values(DestinationPort) as dest_ports by ProcessId, _time ]
| where isnotnull(dest_ips)
iseval = 0

[inv_lolbas_chain]
definition = `ps_lolbas_suspicious`
| join type=left ProcessId, _time
    [ `ps_process`
    | where match(ParentProcessId, ProcessId)
    | stats values(New_Process_Name) as children by ParentProcessId, _time ]
| where isnotnull(children)
iseval = 0

[inv_lateral_chain]
definition = `ps_admin_logon`
| join type=left TargetUserName, _time
    [ `ps_smb_lateral`
    | stats values(New_Process_Name) as lateral_tools by TargetUserName, _time ]
| where isnotnull(lateral_tools)
iseval = 0

# ============================================================
# ENRICHMENT MACROS
# ============================================================

[enrich_vt]
definition = lookup virustotal_lookup hash AS file_hash OUTPUT reputation, malicious_count, last_analysis
iseval = 0

[enrich_abuseipdb]
definition = lookup abuseipdb_lookup ip AS DestinationIp OUTPUT abuse_confidence_score, country, isp
iseval = 0

[enrich_alienvault]
definition = lookup alienvault_otx_lookup indicator AS DestinationIp OUTPUT pulse_count, malware_families, tags
iseval = 0

# ============================================================
# EXAMPLE USAGE
# ============================================================
#
# # Find brute force chains
# `inv_bruteforce_chain`
#
# # PowerShell encoded + network
# `inv_ps_encoded_network`
# | table _time, host, New_Process_Name, Command_Line, dest_ips, dest_ports
#
# # LOLBAS execution chain
# `inv_lolbas_chain`
# | table _time, host, New_Process_Name, Command_Line, children
#
# # Lateral movement
# `inv_lateral_chain`
# | table _time, host, TargetUserName, IpAddress, lateral_tools
#
# # LSASS access
# `ps_lsass_access`
# | table _time, host, SourceImage, TargetImage, GrantedAccess
#
# # Scheduled task persistence
# `ps_scheduled_task`
# | table _time, host, SubjectUserName, TaskName, Task_Content